<html>
<head>
  <title>폼연습</title>
</head>
<body>
<h2>양식 폼 연습하기</h2>
<form name="myform" method="post">
  <p>성명1 : <input type="text" name="name1" id="name1" required /></p>
  <p>성명2 : <input type="text" name="name2" id="name2" size="10" /></p>
  <p>성명3 : <input type="text" name="name3" id="name3" size="10" maxlength="10" /></p>
  <p>성명4 : <input type="text" name="name4" id="name4" value="홍길동" size="10" maxlength="10" /></p>
  <p>성명5 : <input type="text" name="name5" id="name5" size="10" maxlength="10" autofocus /></p>
  <p>성명6 : <input type="text" name="name6" id="name6" maxlength="10" placeholder="성명을 입력하세요." /></p>
  <p>이메일 : <input type="email" name="email" id="email" /></p>
  <p>홈페이지 : <input type="text" name="homepage" id="homepage" /></p>
  <p>전화번호 : <input type="tel" name="tel" id="tel" /></p>
  <p>색상 : <input type="color" name="color" id="color" /></p>
  <p>생일 : <input type="date" name="birthday" id="birthday" /></p>
  <p>출근시간 : <input type="time" name="startTime" id="startTime" /></p>
  <p>입고사항 : <input type="datetime-local" name="ipgo" id="ipgo" /></p>
  <p>비밀번호 : <input type="password" name="pwd" id="pwd" placeholder="비밀번호를 입력하세요." /></p>
  <p>나이1 : <input type="number" name="age1" id="age1" /></p>
  <p>나이2 : <input type="number" name="age2" id="age2" size="3" min="17" max="120" /></p>
  <p>수량1 : <input type="number" name="ea1" id="ea1" value="1" min="0" max="100" /></p>
  <p>수량2(묶음) : <input type="number" name="ea2" id="ea2" value="0" min="0" max="100" step="10" /></p>
  <p>성별 : 
    <input type="radio" name="gender" id="male" value="남자" />남자
    <input type="radio" name="gender" id="female" value="여자" checked />여자
  </p>
  <p>소지한카드 :
    <input type="checkbox" name="card" id="card1" value="LG카드" checked>LG카드
    <input type="checkbox" name="card" id="card2" value="삼성카드">삼성카드
    <input type="checkbox" name="card" id="card2" value="농협카드">농협카드
    <input type="checkbox" name="card" id="card2" value="BC카드">BC카드
    <input type="checkbox" name="card" id="card2" value="신한카드">신한카드
    <input type="checkbox" name="card" id="card2" value="기타">기타
    <input type="text" name="cardText" id="cardText" size="5" />
  </p>
  <p>특기
    <select name="skill" id="skill">
      <option value="">특기를 선택하세요</option>
      <option value="축구">축구</option>
      <option value="야구">야구</option>
      <option value="수영">수영</option>
      <option value="악기">악기</option>
      <option value="기타" selected>기타</option>
    </select>
  </p>
  <p>취미
    <select name="hobby" id="hobby" size="5" multiple>
      <option>등산</option>
      <option>낚시</option>
      <option>바이크</option>
      <option>바둑</option>
      <option>수영</option>
      <option>독서</option>
      <option>영화감상</option>
      <option>음악감상</option>
      <option>동전수집</option>
      <option>그림그리기</option>
    </select>
  </p>
  <p><textarea rows="5" cols="50" name="center" id="content" placeholder="자기소개를 입력하세요"></textarea></p>
  <p><input type="file" name="fileName" id="fileName" placeholder="첨부할 파일 선택" /></p>
  <p>
    <input type="submit" value="회원가입" />
    <input type="reset" value="입력취소" />
    <input type="button" value="입력체크" />
  </p>
</form>
</body>
</html>
