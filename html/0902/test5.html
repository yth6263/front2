<html>
<head>
  <title>표연습</title>
</head>
<body>
  <h2>표 연습1(연습)</h2>
  <table align="center" border="10px" cellspacing="6px" width="300px" height="250px">
    <tr>
      <td align="center">1</td>
      <td align="right">2</td>
      <td valign="top">3</td>
      <td valign="bottom">4</td>
    </tr>
    <tr align="center">
      <td>21</td>
      <td>22</td>
      <td>23</td>
      <td>24</td>
    </tr>
    <tr>
      <td>31</td>
      <td>32</td>
      <td>33</td>
      <td>4</td>
    </tr>
  </table>
  <hr/>
  <h2>표 연습2(가족관계)</h2>
  <table align="center" border="0px" cellpadding="20px" cellspacing="0px">
    <tr>
      <td align="center" bgcolor="red">1</td>
      <td align="right" bgcolor="#00ff00">2</td>
      <td valign="top" bgcolor="pink">3</td>
      <td valign="bottom" bgcolor="skyblue">4</td>
    </tr>
    <tr align="center" bgcolor="#brown">
      <td><font color="#fff">21</font></td>
      <td><font color="#fff">22</font></td>
      <td><font color="#fff">23</font></td>
      <td><font color="#fff">24</font></td>
    </tr>
    <tr bgcolor="#ccc">
      <td>31</td>
      <td>32</td>
      <td>33</td>
      <td>4</td>
    </tr>
  </table>
  <hr/>
  <h2>표 연습3(가족관계)</h2>
  <table align="center" border="1px" cellspacing="0px" width="300px" height="250px">
    <tr align="center">
      <td>1</td>
      <td>2</td>
      <td colspan="2">3</td>
    </tr>
    <tr align="center">
      <td rowspan="2">21</td>
      <td>22</td>
      <td>23</td>
      <td rowspan="2">24</td>
    </tr>
    <tr align="center">
      <td>32</td>
      <td >33</td>
      <td>
    </tr>
  </table>
  <hr/>
</body>
</html>
