<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test6.html(css연습)</title>
  <style>
    * {
      background-color: #ddd;
      color: blue;
    }
    h2 {color: rgba(255, 115, 0, 0.712);}
    span {
      color:blueviolet; 
      font-size: 25px;
    }
    div {background-color: burlywood;}
    .mbc {
      font-size: 20px;
      color: brown;
    }
    #sbs {
      color: white;
      background-color: red;
    }
    .kbs {font-family: '궁서채',"굴림체","명조체";}
    .kbs#cbs {
      font-family: '궁서체',"굴림체","명조체";
      font-size: 20px;
      color: red;
      background-color: burlywood;
    }
    p#aaa {
      font-size: 30px;
      font-weight: 300;
    }
    .seoul {background-color: blue;}
    .kbs.seoul {background-color: white;}
  </style>
</head>
<body>
  <h2>css연습</h2>
  <p id="aaa">1.안녕하세요</p>
  <p style="font-size: 60px;">2.안녕하세요</p>
  <p>3.안녕하세요</p>
  <p class="mbc">4.안녕하세요</p>
  <p>5.안녕하세요</p>
  <p class="mbc">6.안녕하세요</p>
  <p id="sbs">7.안녕하세요</p>
  <p class="mbc">8.안녕하세요</p>
  <p>9.안녕하세요</p>
  <div>10.안녕하세요</div>
  <p>11.<span>안녕</span>하세요</p>
  <p>12.안녕하세요</p>
  <p>13.안녕하세요</p>
  <div class="kbs">
    <div>14-1.안녕하세요</div>
    <div id="cbs">14-2.안녕하세요</div>
    <div class="seoul">14-3.안녕하세요</div>
    <div>14-4.안녕하세요</div>
  </div>
  <div>15.안녕하세요</div>
  <div class="seoul">16.안녕하세요</div>
</body>
</html>
